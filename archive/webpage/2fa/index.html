<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>2FA 动态验证码（纯前端）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace;
  background: #f5f5f7; color: #1d1d1f; padding: 20px;
}
.container { max-width: 800px; margin: 0 auto; }
h1 { font-size: 1.5em; margin-bottom: 10px; }
.countdown { font-size: 0.9em; margin-bottom: 10px; }
.progress-bar {
  width: 100%; height: 4px; background: #e5e5ea;
  border-radius: 2px; overflow: hidden; margin-bottom: 20px;
}
.progress-fill {
  height: 100%; background: #007aff;
  width: 100%; transition: width 1s linear;
}
.card {
  background: #fff; border: 1px solid #e5e5ea;
  border-radius: 12px; padding: 16px; margin-bottom: 14px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.card-label { font-weight: 600; margin-bottom: 6px; }
.card-code {
  font-size: 2.2em; font-weight: 700; letter-spacing: 6px;
  font-family: 'Courier New', monospace;
}
.card-secret { font-size: 0.75em; color: #aeaeb2; margin-top: 6px; }
.invalid { color: #ff3b30; }
textarea {
  width: 100%; height: 100px; font-family: 'Courier New', monospace;
  padding: 10px; margin-bottom: 10px;
}
button {
  background: #007aff; color: #fff; border: none;
  padding: 10px 16px; border-radius: 6px; cursor: pointer;
}
button.danger { background: #ff3b30; }
.hint { font-size: 0.8em; color: #86868b; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="container">
  <h1>🔐 2FA 动态验证码</h1>

  <div class="countdown">
    刷新倒计时：<span id="remaining">30</span>s
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  </div>

  <div class="hint">
    格式：<b>标签:密钥</b>（一行一个）<br>
    示例：<code>GitHub:JBSWY3DPEHPK3PXP</code>
  </div>

  <textarea id="input" placeholder="在此输入或粘贴 标签:密钥"></textarea>
  <button onclick="saveSecrets()">保存</button>
  <button class="danger" onclick="clearSecrets()">清空</button>

  <div id="list" style="margin-top:20px"></div>
</div>

<script>
const PERIOD = 30;
const DIGITS = 6;

/* ---------- Base32 ---------- */
function base32Decode(secret) {
  const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  secret = secret.toUpperCase().replace(/=+$/g, "").replace(/[^A-Z2-7]/g, "");
  if (!secret) return new Uint8Array(0);
  let bits = "";
  for (const c of secret) {
    bits += A.indexOf(c).toString(2).padStart(5, "0");
  }
  const bytes = [];
  for (let i = 0; i + 8 <= bits.length; i += 8) {
    bytes.push(parseInt(bits.substr(i, 8), 2));
  }
  return new Uint8Array(bytes);
}

/* ---------- TOTP ---------- */
async function totp(secret) {
  const keyBytes = base32Decode(secret);
  if (!keyBytes.length) throw new Error("empty secret");

  const key = await crypto.subtle.importKey(
    "raw", keyBytes,
    { name: "HMAC", hash: "SHA-1" },
    false, ["sign"]
  );
  const counter = Math.floor(Date.now() / 1000 / PERIOD);
  const buf = new ArrayBuffer(8);
  new DataView(buf).setBigUint64(0, BigInt(counter), false);

  const sig = await crypto.subtle.sign("HMAC", key, buf);
  const h = new Uint8Array(sig);
  const o = h[h.length - 1] & 0x0f;
  const code =
    ((h[o] & 0x7f) << 24) |
    ((h[o + 1] & 0xff) << 16) |
    ((h[o + 2] & 0xff) << 8) |
    (h[o + 3] & 0xff);
  return (code % 10 ** DIGITS).toString().padStart(DIGITS, "0");
}

/* ---------- 存储 ---------- */
function loadSecrets() {
  try {
    return JSON.parse(localStorage.getItem("2fa_secrets") || "[]");
  } catch (e) {
    return [];
  }
}

function saveSecrets() {
  const lines = document.getElementById("input").value.split("\n");
  const arr = [];
  for (const line of lines) {
    const idx = line.indexOf(":");
    if (idx < 1) continue;
    arr.push({
      label: line.substr(0, idx).trim(),
      secret: line.substr(idx + 1).trim()
    });
  }
  localStorage.setItem("2fa_secrets", JSON.stringify(arr));
  render();
}

function clearSecrets() {
  localStorage.removeItem("2fa_secrets");
  document.getElementById("input").value = "";
  render();
}

/* ---------- 渲染 ---------- */
async function render() {
  const list = document.getElementById("list");
  const secrets = loadSecrets();
  list.innerHTML = "";

  if (!secrets.length) {
    list.innerHTML = '<div class="card">暂无密钥，请先添加。</div>';
    return;
  }

  for (const item of secrets) {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="card-label"></div>
      <div class="card-code">……</div>
      <div class="card-secret"></div>
    `;
    div.children[0].textContent = item.label;
    div.children[2].textContent = item.secret.substr(0, 4) + "****";
    list.appendChild(div);

    try {
      const code = await totp(item.secret);
      div.children[1].textContent = code;
    } catch (e) {
      div.children[1].innerHTML = '<span class="invalid">密钥无效</span>';
    }
  }
}

/* ---------- 倒计时 ---------- */
let lastCounter = -1;
function tick() {
  const now = Math.floor(Date.now() / 1000);
  const counter = Math.floor(now / PERIOD);
  const r = PERIOD - (now % PERIOD);

  document.getElementById("remaining").textContent = r;
  document.getElementById("progress").style.width = (r / PERIOD * 100) + "%";

  if (lastCounter !== -1 && counter !== lastCounter) {
    // 新周期：重新算所有验证码
    render();
  }
  lastCounter = counter;
}

setInterval(tick, 1000);
tick();

/* ---------- 初始化 ---------- */
(function init() {
  const secrets = loadSecrets();
  document.getElementById("input").value =
    secrets.map(s => s.label + ":" + s.secret).join("\n");
  render();
})();
</script>
</body>
</html>
