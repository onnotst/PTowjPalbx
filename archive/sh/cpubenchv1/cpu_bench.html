<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPU Benchmark — Browser Edition</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  background: #0d1117; color: #e6edf3;
  padding: 20px; line-height: 1.6;
}
.container { max-width: 780px; margin: 0 auto; }
h1 { font-size: 1.4em; margin-bottom: 4px; color: #58a6ff; }
.subtitle { font-size: 0.85em; color: #8b949e; margin-bottom: 20px; }
.section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
.section h2 { font-size: 1em; color: #f0ad4e; margin-bottom: 10px; }
.row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #21262d; font-size: 0.9em; }
.row:last-child { border-bottom: none; }
.row .label { color: #8b949e; }
.row .value { color: #3fb950; font-weight: bold; }
.row .value.running { color: #58a6ff; }
.row .value.done { color: #3fb950; }
.btn {
  background: #238636; color: #fff; border: none; padding: 12px 28px;
  border-radius: 6px; font-size: 1em; cursor: pointer; font-family: inherit;
}
.btn:hover { background: #2ea043; }
.btn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
.progress { height: 4px; background: #21262d; border-radius: 2px; margin-top: 10px; overflow: hidden; }
.progress-bar { height: 100%; background: #58a6ff; width: 0%; transition: width 0.3s; }
.summary { background: #0d1117; border: 2px solid #58a6ff; }
footer { text-align: center; color: #484f58; font-size: 0.75em; margin-top: 20px; }
@media (max-width: 500px) {
  .row { font-size: 0.8em; }
  h1 { font-size: 1.1em; }
}
</style>
</head>
<body>
<div class="container">
  <h1>⚡ CPU Benchmark — Browser Edition</h1>
  <p class="subtitle">纯前端跑分 · 无服务器 · 无依赖 · 打开即跑</p>

  <div class="section" id="sysinfo">
    <h2>📋 系统信息</h2>
    <div class="row"><span class="label">User-Agent</span><span class="value" id="ua">检测中...</span></div>
    <div class="row"><span class="label">平台</span><span class="value" id="plat">-</span></div>
    <div class="row"><span class="label">逻辑核心</span><span class="value" id="cores">-</span></div>
    <div class="row"><span class="label">内存(估算)</span><span class="value" id="mem">-</span></div>
    <div class="row"><span class="label">浏览器/引擎</span><span class="value" id="engine">-</span></div>
  </div>

  <div class="section">
    <h2>🏃 测试项目</h2>
    <div class="row"><span class="label">[1/4] 整数累加</span><span class="value" id="r1">等待</span></div>
    <div class="row"><span class="label">[2/4] 整数乘加+取模</span><span class="value" id="r2">等待</span></div>
    <div class="row"><span class="label">[3/4] 标量浮点</span><span class="value" id="r3">等待</span></div>
    <div class="row"><span class="label">[4/4] 内存顺序读</span><span class="value" id="r4">等待</span></div>
    <div class="progress"><div class="progress-bar" id="bar"></div></div>
  </div>

  <button class="btn" id="runbtn" onclick="start()">开始跑分 (20秒)</button>

  <div class="section summary" id="summary" style="display:none;">
    <h2>📊 汇总分数</h2>
    <div class="row"><span class="label">整数累加</span><span class="value" id="s1">-</span></div>
    <div class="row"><span class="label">整数乘加</span><span class="value" id="s2">-</span></div>
    <div class="row"><span class="label">标量浮点</span><span class="value" id="s3">-</span></div>
    <div class="row"><span class="label">内存带宽</span><span class="value" id="s4">-</span></div>
  </div>

  <footer>
    纯前端计算 · 数据不离开浏览器 · 同源对比请用同一浏览器同一时长<br>
    提示：手机端请保持屏幕常亮，后台会降频导致分数偏低
  </footer>
</div>

<script>
// ============ 系统信息 ============
(function sysinfo() {
  document.getElementById('ua').textContent = navigator.userAgent.substring(0, 60) + '...';
  document.getElementById('plat').textContent = navigator.platform || '未知';
  document.getElementById('cores').textContent = navigator.hardwareConcurrency || '未知';
  document.getElementById('mem').textContent = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : '不可用';
  const ua = navigator.userAgent;
  let engine = '未知';
  if (ua.includes('Chrome') && !ua.includes('Edg')) engine = 'V8 (Chrome/Chromium)';
  else if (ua.includes('Edg')) engine = 'V8 (Edge)';
  else if (ua.includes('Firefox')) engine = 'SpiderMonkey (Firefox)';
  else if (ua.includes('Safari') && !ua.includes('Chrome')) engine = 'JavaScriptCore (Safari)';
  document.getElementById('engine').textContent = engine;
})();

// ============ 防优化屏障 ============
let sink = 0;

// ============ 1. 整数累加 ============
function benchIntAdd(seconds) {
  const deadline = performance.now() + seconds * 1000;
  let ops = 0, s = 0;
  while (performance.now() < deadline) {
    for (let i = 1; i <= 1000000; i++) s += i;
    ops += 1000000;
  }
  sink = s;
  return ops;
}

// ============ 2. 整数乘加+取模 (FNV变体) ============
function benchIntMadd(seconds) {
  const deadline = performance.now() + seconds * 1000;
  let ops = 0, h = 0x811C9DC5;
  while (performance.now() < deadline) {
    for (let i = 0; i < 200000; i++) {
      h = (h ^ (i * 0x01000193)) * 0x100000001;
      h ^= h >> 13;
      h = Math.imul(h, 0x5bd1e995);
      h ^= h >> 15;
    }
    ops += 200000;
  }
  sink = h;
  return ops;
}

// ============ 3. 标量浮点 ============
function benchFloat(seconds) {
  const deadline = performance.now() + seconds * 1000;
  let ops = 0; let x = 1.0;
  while (performance.now() < deadline) {
    for (let i = 0; i < 50000; i++) {
      x = x * 1.0000001 + 0.0000003;
      x = x / 1.00000005 - 0.0000001;
      x = x * 0.9999999 + 0.5;
    }
    ops += 50000 * 3;
  }
  sink = x;
  return ops;
}

// ============ 4. 内存顺序读 ============
function benchMemRead(seconds) {
  const SIZE = 16 * 1024 * 1024; // 16MB
  const buf = new Uint32Array(SIZE);
  for (let i = 0; i < SIZE; i++) buf[i] = i;
  const deadline = performance.now() + seconds * 1000;
  let ops = 0, sum = 0;
  while (performance.now() < deadline) {
    for (let i = 0; i < SIZE; i += 8) {
      sum += buf[i] + buf[i+1] + buf[i+2] + buf[i+3] + buf[i+4] + buf[i+5] + buf[i+6] + buf[i+7];
    }
    ops += SIZE / 8;
  }
  sink = sum;
  return ops * 8 * 4; // 每次读4字节
}

// ============ 格式化 ============
function fmt(n, unit) {
  if (n >= 1e12) return (n / 1e12).toFixed(2) + ' T' + unit;
  if (n >= 1e9) return (n / 1e9).toFixed(2) + ' G' + unit;
  if (n >= 1e6) return (n / 1e6).toFixed(2) + ' M' + unit;
  if (n >= 1e3) return (n / 1e3).toFixed(2) + ' K' + unit;
  return n.toFixed(0) + unit;
}

// ============ 主流程 ============
function setStatus(id, text, cls) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'value ' + cls;
}

const TIMEOUT = 20; // 每项20秒

async function start() {
  document.getElementById('runbtn').disabled = true;
  document.getElementById('summary').style.display = 'none';
  document.getElementById('bar').style.width = '0%';

  // 1/4
  setStatus('r1', '运行中...', 'running');
  await new Promise(r => setTimeout(r, 50));
  const t1 = performance.now();
  const ops1 = benchIntAdd(TIMEOUT);
  const dt1 = (performance.now() - t1) / 1000;
  setStatus('r1', fmt(ops1 / dt1, ' ops/sec'), 'done');
  document.getElementById('bar').style.width = '25%';

  // 2/4
  setStatus('r2', '运行中...', 'running');
  await new Promise(r => setTimeout(r, 50));
  const t2 = performance.now();
  const ops2 = benchIntMadd(TIMEOUT);
  const dt2 = (performance.now() - t2) / 1000;
  setStatus('r2', fmt(ops2 / dt2, ' ops/sec'), 'done');
  document.getElementById('bar').style.width = '50%';

  // 3/4
  setStatus('r3', '运行中...', 'running');
  await new Promise(r => setTimeout(r, 50));
  const t3 = performance.now();
  const ops3 = benchFloat(TIMEOUT);
  const dt3 = (performance.now() - t3) / 1000;
  setStatus('r3', fmt(ops3 / dt3, ' flops/sec'), 'done');
  document.getElementById('bar').style.width = '75%';

  // 4/4
  setStatus('r4', '运行中...', 'running');
  await new Promise(r => setTimeout(r, 50));
  const t4 = performance.now();
  const bytes4 = benchMemRead(TIMEOUT);
  const dt4 = (performance.now() - t4) / 1000;
  setStatus('r4', fmt(bytes4 / dt4 / 1024 / 1024, ' MiB/s'), 'done');
  document.getElementById('bar').style.width = '100%';

  // 汇总
  document.getElementById('s1').textContent = fmt(ops1 / dt1, ' ops/sec');
  document.getElementById('s2').textContent = fmt(ops2 / dt2, ' ops/sec');
  document.getElementById('s3').textContent = fmt(ops3 / dt3, ' flops/sec');
  document.getElementById('s4').textContent = fmt(bytes4 / dt4 / 1024 / 1024, ' MiB/s');
  document.getElementById('summary').style.display = 'block';

  document.getElementById('runbtn').disabled = false;
  document.getElementById('runbtn').textContent = '重新跑分';
}
</script>
</body>
</html>
