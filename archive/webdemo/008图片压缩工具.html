<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线图片压缩工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 60px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #764ba2;
            background-color: #f8f9ff;
            transform: translateY(-2px);
        }

        .upload-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 15px;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .controls {
            display: none;
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .slider-container {
            position: relative;
            margin: 10px 0;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .value-display {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 1px solid #ffeaa7;
            display: none;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
            display: none;
        }

        .preview-section {
            display: none;
            margin-top: 30px;
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .preview-box {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .preview-box h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .image-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .file-info {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 8px;
            font-size: 0.9em;
            line-height: 1.6;
            text-align: left;
        }

        .download-btn {
            background: linear-gradient(45deg, #28a745, #20c997);
            font-size: 1.1em;
            padding: 15px 30px;
            margin-top: 20px;
        }

        .progress-bar {
            display: none;
            width: 100%;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .file-count {
            background: #17a2b8;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .preview-container {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖼️ 图片压缩工具</h1>
            <p>支持 JPG、PNG、WebP 等常见格式，可多选</p>
        </div>

        <div class="main-content">
            <div class="warning" id="warningMsg">
                ⚠️ 大文件可能会消耗较多内存和处理时间，请耐心等待...
            </div>
            
            <div class="error" id="errorMsg"></div>

            <!-- 上传区域 -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">拖拽图片到此处或点击选择文件</div>
                <div style="color: #999; font-size: 0.9em;">
                    支持 JPG、PNG、WebP、GIF、BMP 等格式<br>
                    纯本地处理，不上传服务器，保护您的隐私
                </div>
                <input type="file" id="fileInput" class="file-input" accept="image/*" multiple>
                <button class="btn" id="selectFileBtn">选择图片</button>
                <!-- 在selectFileBtn按钮旁边添加剪贴板按钮 -->
                <button id="pasteFromClipboardBtn" class="btn">从剪贴板粘贴图片</button>
            </div>

            <!-- 控制面板 -->
            <div class="controls" id="controls">
                <div class="control-group">
                    <label>压缩质量 <span class="file-count" id="fileCount">0 个文件</span></label>
                    <div class="slider-container">
                        <input type="range" id="qualitySlider" class="slider" min="10" max="100" value="30">
                        <span class="value-display" id="qualityValue">30%</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>最大宽度</label>
                    <div class="slider-container">
                        <input type="range" id="widthSlider" class="slider" min="200" max="4000" value="1920" step="50">
                        <span class="value-display" id="widthValue">1920px</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>输出格式</label>
                    <select id="formatSelect" style="padding: 8px 12px; border-radius: 5px; border: 1px solid #ddd; width: 100%;">
                        <option value="original">保持原格式</option>
                        <option value="jpeg" selected>JPEG</option>
                        <option value="png">PNG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>

                <button class="btn" onclick="compressImages()" id="compressBtn">开始压缩</button>
                
                <!-- 进度条 -->
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- 预览区域 -->
            <div class="preview-section" id="previewSection">
                <div class="preview-container" id="previewContainer">
                    <!-- 动态生成预览内容 -->
                </div>
                <div style="text-align: center;">
                    <button class="btn download-btn" id="downloadAllBtn" onclick="downloadAll()" style="display: none;">下载所有压缩后的图片</button>
                </div>
            </div>
        </div>
    </div>
    


<script>
    let selectedFiles = [];
    let compressedResults = [];

    // DOM元素
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const selectFileBtn = document.getElementById('selectFileBtn');
    // 新增：剪贴板按钮
    const pasteFromClipboardBtn = document.getElementById('pasteFromClipboardBtn');
    const controls = document.getElementById('controls');
    const previewSection = document.getElementById('previewSection');
    const warningMsg = document.getElementById('warningMsg');
    const errorMsg = document.getElementById('errorMsg');
    const fileCount = document.getElementById('fileCount');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityValue = document.getElementById('qualityValue');
    const widthSlider = document.getElementById('widthSlider');
    const widthValue = document.getElementById('widthValue');

    // 按钮点击直接触发文件选择
    selectFileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        fileInput.click();
    });

    // 新增：剪贴板按钮点击事件
    pasteFromClipboardBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        await pasteImageFromClipboard();
    });

    // 上传区域点击（非按钮部分）也触发文件选择
    uploadArea.addEventListener('click', (e) => {
        if (e.target !== selectFileBtn && !selectFileBtn.contains(e.target) &&
            e.target !== pasteFromClipboardBtn && !pasteFromClipboardBtn.contains(e.target)) {
            fileInput.click();
        }
    });
    
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });
    
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
    });
    
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        const files = Array.from(e.dataTransfer.files).filter(file => isImageFile(file));
        handleFiles(files);
    });

    // 文件选择后强制清空value，确保重复选择生效
    fileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        handleFiles(files);
        fileInput.value = ''; 
    });

    // 判断是否为图片文件
    function isImageFile(file) {
        return file.type.startsWith('image/');
    }

    // 滑块值更新
    qualitySlider.addEventListener('input', (e) => {
        qualityValue.textContent = e.target.value + '%';
    });

    widthSlider.addEventListener('input', (e) => {
        widthValue.textContent = e.target.value + 'px';
    });

    // 处理选择的文件
    function handleFiles(files) {
        if (files.length === 0) return;
        
        // 清空之前的选择
        selectedFiles = [];
        compressedResults = [];
        
        // 过滤有效文件
        const validFiles = files.filter(file => isImageFile(file));
        
        if (validFiles.length === 0) {
            showError('未选择有效图片文件');
            return;
        }
        
        // 更新选择的文件列表
        selectedFiles = validFiles;
        updateFileCount();
        controls.style.display = 'block';
        previewSection.style.display = 'none';
        hideError();
        
        // 检查是否有大文件
        const hasLargeFile = selectedFiles.some(file => file.size > 10 * 1024 * 1024);
        warningMsg.style.display = hasLargeFile ? 'block' : 'none';
    }

    // 新增：从剪贴板粘贴图片
    async function pasteImageFromClipboard() {
        try {
            // 检查浏览器是否支持剪贴板API
            if (!navigator.clipboard || !navigator.clipboard.read) {
                showError('您的浏览器不支持剪贴板读取功能，请使用Chrome、Edge等现代浏览器');
                return;
            }

            showError('请在剪贴板中准备好图片，正在读取...');
            
            // 读取剪贴板内容
            const items = await navigator.clipboard.read();
            const imageFiles = [];

            for (const item of items) {
                // 查找图片类型的剪贴板项
                const imageType = item.types.find(type => type.startsWith('image/'));
                if (imageType) {
                    const blob = await item.getType(imageType);
                    // 将blob转换为File对象
                    const file = new File([blob], `clipboard_image_${Date.now()}.${imageType.split('/')[1]}`, {
                        type: imageType,
                        lastModified: Date.now()
                    });
                    imageFiles.push(file);
                    break; // 只取第一张图片
                }
            }

            if (imageFiles.length === 0) {
                showError('剪贴板中未找到图片，请先复制图片再尝试');
                return;
            }

            // 处理读取到的图片文件
            handleFiles(imageFiles);
            hideError(); // 隐藏加载提示
            showError('已从剪贴板读取图片成功！');

        } catch (error) {
            console.error('读取剪贴板失败:', error);
            // 不同错误类型的友好提示
            if (error.name === 'NotAllowedError') {
                showError('需要您授权剪贴板访问权限，请允许后重试');
            } else if (error.name === 'NotFoundError') {
                showError('剪贴板中没有找到图片内容');
            } else {
                showError('读取剪贴板失败：' + error.message);
            }
        }
    }

    // 更新文件计数
    function updateFileCount() {
        fileCount.textContent = `${selectedFiles.length} 个文件`;
    }

    // 显示错误信息
    function showError(message) {
        errorMsg.textContent = message;
        errorMsg.style.display = 'block';
        // 3秒后自动隐藏非关键错误
        setTimeout(() => {
            if (errorMsg.textContent === message) {
                hideError();
            }
        }, 3000);
    }

    // 隐藏错误信息
    function hideError() {
        errorMsg.style.display = 'none';
    }

    // 压缩图片
    async function compressImages() {
        if (selectedFiles.length === 0) {
            showError('请先选择图片文件');
            return;
        }

        const quality = parseInt(qualitySlider.value) / 100;
        const maxWidth = parseInt(widthSlider.value);
        const outputFormat = document.getElementById('formatSelect').value;
        
        compressedResults = [];
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const previewContainer = document.getElementById('previewContainer');
        const compressBtn = document.getElementById('compressBtn');
        
        compressBtn.disabled = true;
        compressBtn.textContent = '压缩中...';
        progressBar.style.display = 'block';
        previewContainer.innerHTML = '';
        hideError();
        
        try {
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                
                // 显示处理进度
                progressFill.style.width = ((i + 1) / selectedFiles.length * 100) + '%';
                
                try {
                    const result = await compressRegularImage(file, quality, maxWidth, outputFormat);
                    compressedResults.push(result);
                    createPreviewCard(result, i);
                    
                    // 给浏览器一些时间处理其他任务，避免界面卡死
                    if (i % 3 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 10));
                    }
                    
                } catch (error) {
                    console.error(`处理第 ${i + 1} 个文件失败:`, error);
                    // 创建错误预览卡片
                    createErrorCard(file, error.message, i);
                }
            }
            
            progressBar.style.display = 'none';
            previewSection.style.display = 'block';
            
            if (compressedResults.length > 1) {
                document.getElementById('downloadAllBtn').style.display = 'inline-block';
            }
            
            if (compressedResults.length < selectedFiles.length) {
                const failedCount = selectedFiles.length - compressedResults.length;
                showError(`注意：${failedCount} 个文件处理失败，可能由于格式不支持、文件损坏或内存不足。`);
            }
            
        } catch (error) {
            console.error('压缩过程出错:', error);
            showError('处理过程中出现错误，请重试。');
        } finally {
            compressBtn.disabled = false;
            compressBtn.textContent = '开始压缩';
        }
    }

    // 压缩普通图片
    function compressRegularImage(file, quality, maxWidth, outputFormat) {
        return new Promise((resolve, reject) => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = function() {
                try {
                    // 计算新尺寸
                    let { width, height } = calculateNewDimensions(img.width, img.height, maxWidth);
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    // 设置背景色（对于透明PNG）
                    if (outputFormat === 'jpeg') {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, width, height);
                    }
                    
                    // 绘制图片
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // 确定输出格式
                    let mimeType = getOutputMimeType(file.type, outputFormat);
                    let fileExtension = getFileExtension(mimeType);
                    
                    // 转换为blob
                    canvas.toBlob((blob) => {
                        if (!blob) {
                            reject(new Error('Canvas to Blob conversion failed'));
                            return;
                        }
                        
                        const compressedUrl = URL.createObjectURL(blob);
                        const originalSize = file.size;
                        const compressedSize = blob.size;
                        const compressionRatio = originalSize > 0 ? Math.round((1 - compressedSize / originalSize) * 100) : 0;
                        
                        resolve({
                            originalName: file.name,
                            originalSize: originalSize,
                            compressedSize: compressedSize,
                            compressionRatio: compressionRatio,
                            compressedUrl: compressedUrl,
                            blob: blob,
                            mimeType: mimeType,
                            extension: fileExtension,
                            width: width,
                            height: height
                        });
                    }, mimeType, quality);
                    
                } catch (error) {
                    reject(error);
                } finally {
                    URL.revokeObjectURL(img.src);
                }
            };
            
            img.onerror = () => {
                URL.revokeObjectURL(img.src);
                reject(new Error('图片加载失败'));
            };
            
            img.src = URL.createObjectURL(file);
        });
    }

    // 计算新尺寸
    function calculateNewDimensions(originalWidth, originalHeight, maxWidth) {
        if (originalWidth <= maxWidth) {
            return { width: originalWidth, height: originalHeight };
        }
        
        const ratio = originalHeight / originalWidth;
        const newWidth = maxWidth;
        const newHeight = Math.round(maxWidth * ratio);
        
        return { width: newWidth, height: newHeight };
    }

    // 获取输出MIME类型
    function getOutputMimeType(originalType, outputFormat) {
        switch (outputFormat) {
            case 'jpeg':
                return 'image/jpeg';
            case 'png':
                return 'image/png';
            case 'webp':
                return 'image/webp';
            default:
                return originalType;
        }
    }

    // 获取文件扩展名
    function getFileExtension(mimeType) {
        const extensions = {
            'image/jpeg': 'jpg',
            'image/png': 'png',
            'image/webp': 'webp',
            'image/gif': 'gif'
        };
        return extensions[mimeType] || 'jpg';
    }

    // 创建预览卡片
    function createPreviewCard(result, index) {
        const previewContainer = document.getElementById('previewContainer');
        
        const cardHtml = `
            <div class="preview-box">
                <h3>🖼️ 图片 ${index + 1}: ${result.originalName}</h3>
                <img src="${result.compressedUrl}" alt="压缩后图片" class="image-preview">
                <div class="file-info">
                    <strong>原始大小:</strong> ${formatFileSize(result.originalSize)}<br>
                    <strong>压缩后:</strong> ${formatFileSize(result.compressedSize)}<br>
                    <strong>压缩率:</strong> ${result.compressionRatio}%<br>
                    <strong>尺寸:</strong> ${result.width} × ${result.height}<br>
                    <strong>格式:</strong> ${result.mimeType}
                </div>
                <button class="btn" onclick="downloadSingle(${index})">下载此图片</button>
            </div>
        `;
        
        previewContainer.innerHTML += cardHtml;
    }

    // 创建错误卡片
    function createErrorCard(file, errorMessage, index) {
        const previewContainer = document.getElementById('previewContainer');
        
        const cardHtml = `
            <div class="preview-box">
                <h3>❌ 图片 ${index + 1}: ${file.name}</h3>
                <div style="padding: 40px; color: #dc3545;">
                    <div style="font-size: 3em; margin-bottom: 15px;">⚠️</div>
                    <div><strong>处理失败</strong></div>
                    <div style="font-size: 0.9em; margin-top: 10px; color: #666;">${errorMessage}</div>
                </div>
                <div class="file-info">
                    <strong>文件大小:</strong> ${formatFileSize(file.size)}<br>
                    <strong>文件类型:</strong> ${file.type || '未知'}
                </div>
            </div>
        `;
        
        previewContainer.innerHTML += cardHtml;
    }

    // 格式化文件大小
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // 下载单个文件
    function downloadSingle(index) {
        if (!compressedResults[index]) return;
        
        const result = compressedResults[index];
        const link = document.createElement('a');
        link.href = result.compressedUrl;
        const originalNameWithoutExt = result.originalName.replace(/\.[^/.]+$/, "");
        link.download = `${originalNameWithoutExt}_compressed.${result.extension}`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // 下载所有文件
    function downloadAll() {
        if (compressedResults.length === 0) return;
        
        // 逐个下载，避免浏览器阻止弹窗
        compressedResults.forEach((result, index) => {
            setTimeout(() => {
                downloadSingle(index);
            }, index * 200);
        });
    }

    // 页面卸载时清理对象URL
    window.addEventListener('beforeunload', () => {
        [...compressedResults].forEach(result => {
            if (result.compressedUrl) {
                URL.revokeObjectURL(result.compressedUrl);
            }
        });
    });
</script>
