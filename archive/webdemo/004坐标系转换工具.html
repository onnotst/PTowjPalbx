<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>坐标系转换工具</title>
  <style>
    body { font-family: -apple-system, Arial; padding: 24px; max-width: 600px; }
    input, select, button { padding: 8px; margin: 6px 0; width: 100%; box-sizing: border-box; }
    button { background: #1677ff; color: #fff; border: none; cursor: pointer; }
    pre { background: #f5f5f5; padding: 12px; margin-top: 16px; }
  </style>
</head>
<body>

  <h2>🔄 坐标系转换工具</h2>

  <input id="lat" type="number" step="any" placeholder="纬度 lat" value="39.9042">
  <input id="lng" type="number" step="any" placeholder="经度 lng" value="116.4074">

  <select id="from">
    <option value="wgs84">WGS-84（GPS）</option>
    <option value="gcj02">GCJ-02（高德/腾讯）</option>
    <option value="bd09">BD-09（百度）</option>
  </select>

  <select id="to">
    <option value="gcj02">GCJ-02（高德/腾讯）</option>
    <option value="bd09">BD-09（百度）</option>
    <option value="wgs84">WGS-84（GPS）</option>
  </select>

  <button onclick="doConvert()">转换</button>

  <pre id="output"></pre>

  <script src="/assets/myjs/coord-convert.js"></script>
  <script>
    function doConvert() {
      var lat = parseFloat(document.getElementById('lat').value);
      var lng = parseFloat(document.getElementById('lng').value);
      var from = document.getElementById('from').value;
      var to = document.getElementById('to').value;

      try {
        var result = CoordConvert.convertToObject(lat, lng, from, to);
        document.getElementById('output').textContent =
          JSON.stringify(result, null, 2);
      } catch (e) {
        document.getElementById('output').textContent = '错误：' + e.message;
      }
    }
  </script>

</body>
</html>
