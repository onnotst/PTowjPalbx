<script type="text/javascript" src="https://myhkw.cn/player/js/jquery.min.js"></script>

<body>
    <div id="content-container">
        <!-- 内容将通过JavaScript动态加载 -->
    </div>
    
    <div class="div-button">
        <figure class="wp-block-pullquote">
            <blockquote>
                <a target='_blank' href='edit-index.php'>
                    <div class='item'>
                        <div class='no-logo hight1light'>编辑文件</div>
                    </div>
                </a>
                <a target='_blank' href='edit-config.php'>
                    <div class='item'>
                        <div class='no-logo hight1light'>编辑配置</div>
                    </div>
                </a>
                <a target='_blank' href='edit-sort.php'>
                    <div class='item'>
                        <div class='no-logo hight1light'>编辑顺序</div>
                    </div>
                </a>
                <a target='_blank' href='edit-color.php'>
                    <div class='item'>
                        <div class='no-logo hight1light'>编辑颜色</div>
                    </div>
                </a>
            </blockquote>
        </figure>
    </div>

    <script>
	    // 检测 PHP 是否真正执行
		fetch('php-check.php')
		    .then(res => res.text())
		    .then(text => {
		        if (text.trim() === 'ok') {
		            document.querySelector('.div-button').style.display = 'block';
		        }
		    })
		    .catch(() => {}); // 不显示，保持隐藏
        // 加载配置文件并渲染内容
        fetch('config.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('content-container');
                
                // 按order排序
                data.sections.sort((a, b) => a.order - b.order);
                
                data.sections.forEach(section => {
                    if (section.type === 'quote') {
                        container.innerHTML += `
                            <div id="${section.id}">
                                <figure class="wp-block-pullquote-text">
                                    <blockquote>
                                        <p>${section.content}</p>
                                    </blockquote>
                                </figure>
                            </div>
                        `;
                    } else if (section.type === 'links') {
                        // 对链接按order排序
                        section.links.sort((a, b) => a.order - b.order);
                        
                        let linksHTML = '';
                        section.links.forEach(link => {
                            linksHTML += `
                                <a target='_blank' href='${link.url}'>
                                    <div class='item'>
                                        <div class='no-logo ${link.color}'>${link.name}</div>
                                    </div>
                                </a>
                            `;
                        });
                        
                        container.innerHTML += `
                            <div id="${section.id}">
                                <figure class="wp-block-pullquote">
                                    <blockquote>
                                        ${linksHTML}
                                    </blockquote>
                                </figure>
                            </div>
                            <div style="clear: both;"></div>
                        `;
                    }
                });
            })
            .catch(error => {
                console.error('加载配置文件失败:', error);
                document.getElementById('content-container').innerHTML = 
                    '<p style="text-align:center;color:red;">加载内容失败，请检查配置文件</p>';
            });
    </script>
    <script type="text/javascript" id="myhk" src="https://myhkw.cn/api/player/176396840995" key="176396840995" m="1"></script>
</body>
