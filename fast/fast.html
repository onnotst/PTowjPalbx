<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平稳导航</title>
<style>
:root {
  --bg: #f5f5f5;
  --card: #fff;
  --text: #333;
  --sub: #888;
  --border: #e0e0e0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}
.header {
  padding: 12px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  font-weight: bold;
  position: sticky;
  top: 0;
  z-index: 10;
}
.container {
  padding: 8px;
}
.group {
  margin-bottom: 12px;
}
.group-title {
  font-size: 12px;
  color: var(--sub);
  padding: 4px 8px;
  text-transform: uppercase;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  text-decoration: none;
  color: inherit;
  display: block;
  overflow: hidden;
}
.card:active {
  background: #f0f0f0;
}
.card-name {
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-url {
  font-size: 11px;
  color: var(--sub);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}
.loading {
  padding: 20px;
  text-align: center;
  color: var(--sub);
}
.error {
  padding: 20px;
  color: #d32f2f;
  text-align: center;
}

/* 呼吸闪烁动画 */
@keyframes breatheBlink {
  0%   { opacity: 1; transform: scale(1); }
  50%  { opacity: 0.35; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1); }
}

/* 开启闪烁的圆点 */
.dot.blink {
  animation: breatheBlink 1.6s ease-in-out infinite;
}

</style>
</head>
<body>

<div class="header">平稳导航 - 简单高效的导航页</div>
<div class="container" id="app">
  <div class="loading">加载中...</div>
</div>

<script>
const CONFIG_URL = 'config-fast.ini';

/* ---------- 颜色解析（关键修复） ---------- */
function getColor(val) {
  if (!val) return '';
  // #ffd700
  const hex = val.match(/(#[0-9a-fA-F]{3,8})/);
  if (hex) return hex[1];
  // rgb / rgba
  const rgb = val.match(/\((.*?)\)/);
  return rgb ? rgb[1] : val;
}

/* ---------- 加载配置 ---------- */
async function loadConfig() {
  try {
    const res = await fetch(CONFIG_URL);
    if (!res.ok) throw new Error('无法加载配置');
    const text = await res.text();
    render(parseConfig(text));
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div class="error">加载失败：${e.message}<br>请确认 config.txt 存在</div>`;
  }
}

/* ---------- 解析配置 ---------- */
function parseConfig(text) {
  // 按 ###--- 或 ###-- 或 ###- 切分
  const sections = text.split(/^###[-\-]+\s*$/m);
  const groups = [];
  let colors = {};
  let colorMap = {};

  for (const sec of sections) {
    const trimmed = sec.trim();
    if (!trimmed || trimmed.startsWith('//')) continue;

    // 颜色定义（'hight01light':'...'）
    if (/^'hight\d+light':/m.test(trimmed)) {
      const lines = trimmed.split('\n');
      for (const line of lines) {
        const m = line.match(/'(hight\d+light)'\s*:\s*'([^']+)'/);
        if (m) colors[m[1]] = m[2];
      }
      continue;
    }

    // 颜色映射（短信:hight10light）
    // 关键：不再要求 ###--，只要不是链接就行
    if (
      /^[^\s:]+\s*:\s*hight\d+light\s*$/m.test(trimmed) &&
      !trimmed.includes('http')
    ) {
      const lines = trimmed.split('\n');
      for (const line of lines) {
        const m = line.match(/^([^:]+?)\s*:\s*(hight\d+light)\s*$/);
        if (m) colorMap[m[1]] = m[2];
      }
      continue;
    }

    // 链接组
    const lines = trimmed.split('\n').filter(l => l.includes('：http'));
    if (lines.length > 0) {
      const items = lines.map(l => {
        const idx = l.indexOf('：');
        return {
          name: l.slice(0, idx).trim(),
          url: l.slice(idx + 1).trim()
        };
      });
      groups.push(items);
    }
  }

  return { groups, colors, colorMap };
}

/* ---------- 渲染页面 ---------- */
function render({ groups, colors, colorMap }) {
  const app = document.getElementById('app');
  if (groups.length === 0) {
    app.innerHTML = '<div class="error">配置中未找到链接</div>';
    return;
  }

  let html = '';
  groups.forEach((group, gi) => {
    html += `<div class="group">
      <div class="group-title">分组 ${gi + 1}</div>
      <div class="grid">
    `;
    group.forEach(item => {
      const colorKey = colorMap[item.name];
      const colorVal = colors[colorKey];
      const dot = colorVal
        ? `<span class="dot blink" style="background:${getColor(colorVal)}"></span>`
        : '';
        
      const bgStyle = colorVal
        ? `background:${getColor(colorVal)}22; border-color:${getColor(colorVal)}66;`
        : '';

      html += `
        <a class="card" href="${item.url}" target="_blank" style="${bgStyle}">
          <div class="card-name">${dot}${item.name}</div>
          <div class="card-url">${item.url.replace('https://', '').replace('http://', '')}</div>
        </a>
      `;
    });
    html += `</div></div>`;
  });

  app.innerHTML = html;
}

loadConfig();
</script>
</body>
</html>
