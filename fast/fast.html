<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平稳导航</title>
<style>
:root {
  --bg: #f5f5f5;
  --card: #fff;
  --text: #333;
  --sub: #888;
  --border: #e0e0e0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}
.header {
  padding: 12px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  font-weight: bold;
  position: sticky;
  top: 0;
  z-index: 10;
}
.container {
  padding: 8px;
}
.group {
  margin-bottom: 12px;
}
.group-title {
  font-size: 12px;
  color: var(--sub);
  padding: 4px 8px;
  text-transform: uppercase;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  text-decoration: none;
  color: inherit;
  display: block;
  overflow: hidden;
  transition: background 0.15s, border-color 0.15s;
}
.card:active {
  background: #f0f0f0;
}

/* 颜色背景（通过 JS 内联 style 注入，这里只定义边框/背景的 fallback） */
.card.has-color {
  /* 具体颜色由 JS 通过 style 属性设置 */
}

.card-name {
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
}
.card-url {
  font-size: 11px;
  color: var(--sub);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
  flex-shrink: 0;
}
.loading {
  padding: 20px;
  text-align: center;
  color: var(--sub);
}
.error {
  padding: 20px;
  color: #d32f2f;
  text-align: center;
}

/* 呼吸闪烁动画 —— 只在带 .blink 的 dot 上生效 */
@keyframes breatheBlink {
  0%   { opacity: 1; transform: scale(1); }
  50%  { opacity: 0.35; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1); }
}
.dot.blink {
  animation: breatheBlink 1.6s ease-in-out infinite;
}
</style>
</head>
<body>

<div class="header">平稳导航 - 简单高效的导航页</div>
<div class="container" id="app">
  <div class="loading">加载中...</div>
</div>

<script>
const CONFIG_URL = 'config.json';

/* ---------- 颜色映射表（和编辑器里 30 个对应） ---------- */
const COLOR_MAP = {
  'hight1light':'#f5f5f5','hight2light':'#b2dfdb','hight3light':'#e1bee7',
  'hight4light':'#c8e6c9','hight5light':'#a5d6a7','hight6light':'#bbdefb',
  'hight7light':'#f8bbd0','hight8light':'#ffccbc','hight9light':'#90caf9',
  'hight10light':'#ffe082','hight11light':'#a7ffeb','hight12light':'#f8bbd0',
  'hight13light':'#d1c4e9','hight14light':'#fff9c4','hight15light':'#b3e5fc',
  'hight16light':'#ffab91','hight17light':'#c5e1a5','hight18light':'#fff8e1',
  'hight19light':'#cfd8dc','hight20light':'#f48fb1','hight21light':'#80deea',
  'hight22light':'#b39ddb','hight23light':'#c5e1a5','hight24light':'#fafafa',
  'hight25light':'#ce93d8','hight26light':'#bcaaa4','hight27light':'#80cbc4',
  'hight28light':'#c8e6c9','hight29light':'#ef9a9a','hight30light':'#4dd0e1'
};

/* ---------- 加载 JSON 配置 ---------- */
async function loadConfig() {
  try {
    const res = await fetch(CONFIG_URL);
    if (!res.ok) throw new Error('无法加载 config.json');
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div class="error">加载失败：${e.message}<br>请确认 config.json 存在且格式正确</div>`;
  }
}

/* ---------- 渲染页面 ---------- */
function render(data) {
  const app = document.getElementById('app');
  const sections = data.sections || [];

  if (sections.length === 0) {
    app.innerHTML = '<div class="error">配置中未找到任何区块</div>';
    return;
  }

  let html = '';

  sections.forEach((section, si) => {

    // ===== quote 类型：渲染为分组标题 =====
    // if (section.type === 'quote') {
    //   const title = section.content
    //     ? section.content.replace(/<[^>]*>/g, '').trim()
    //     : `分组 ${si + 1}`;
    //   html += `<div class="group">
    //     <div class="group-title">${title}</div>
    //     <div class="grid"></div>
    //   </div>`;
    //   return;
    // }

    // ===== links 类型：渲染为链接卡片组 =====
    if (section.type === 'links') {
      const groupTitle = section.title || `分组 ${si + 1}`;
      html += `<div class="group">
        <div class="group-title">${groupTitle}</div>
        <div class="grid">
      `;

      if (section.links && section.links.length > 0) {
        section.links.forEach(link => {
          const name = link.name || '';
          const url = link.url || '';
          const colorKey = link.color || '';
          const blink = link.blink === true || link.blink === 'true';

          // 颜色处理
          const colorVal = COLOR_MAP[colorKey] || '';
          let dotHtml = '';
          let cardStyle = '';

          if (colorVal) {
            // dot 颜色
            dotHtml = `<span class="dot${blink ? ' blink' : ''}" style="background:${colorVal}"></span>`;
            // 卡片背景：颜色 + 15% 透明度（hex → 加 22 后缀）
            cardStyle = `background:${colorVal}22; border-color:${colorVal}66;`;
          }

          // URL 显示（去掉协议前缀）
          const displayUrl = url.replace(/^https?:\/\//, '');

          html += `
            <a class="card" href="${url}" target="_blank" style="${cardStyle}">
              <div class="card-name">${dotHtml}${name}</div>
              <div class="card-url">${displayUrl}</div>
            </a>
          `;
        });
      }

      html += `</div></div>`;
    }
  });

  app.innerHTML = html;
}

loadConfig();
</script>
</body>
</html>
