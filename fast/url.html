<body>

<h1>我的导航</h1>

<div id="navContainer" class="nav-list">
    <div style="text-align:center;color:#999;">正在加载导航数据...</div>
</div>

<!-- 底部编辑按钮 -->
<div class="footer-buttons">
    <a href="edit-url.php">编辑文件</a>
    <a href="edit-config.php">编辑配置</a>
    <a href="edit-sort.php">编辑顺序</a>
    <a href="edit-color.php">编辑颜色</a>
</div>

<script>
fetch('config.json')
    .then(res => res.json())
    .then(data => {
        const container = document.getElementById('navContainer');
        container.innerHTML = '';

        // 按 order 排序 sections
        data.sections.sort((a, b) => a.order - b.order);

        data.sections.forEach(section => {

            // 引言
            if (section.type === 'quote') {
                container.innerHTML += `
                    <div class="quote">
                        ${section.content}
                    </div>
                `;
            }

            // 链接组
            if (section.type === 'links') {
                if (section.title) {
                    container.innerHTML += `
                        <div class="section-title">${section.title}</div>
                    `;
                }

                section.links.sort((a, b) => a.order - b.order);

                section.links.forEach(link => {
                    container.innerHTML += `
                        <a class="nav-item ${link.color}" href="${link.url}" target="_blank">
                            ${link.name}  ${link.url}
                        </a>
                    `;
                });
            }
        });
    })
    .catch(err => {
        console.error(err);
        document.getElementById('navContainer').innerHTML =
            '<div style="text-align:center;color:red;">加载导航失败，请检查 config.json</div>';
    });
</script>
